<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="qpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#qpGrad)"/>

  <!-- Question Paper Document with Shadow -->
  <rect x="14" y="11" width="36" height="42" rx="4" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Folded Page Corner -->
  <path d="M38 11 L50 23 L38 23 Z" fill="#cbd5e1"/>
  <path d="M38 11 L50 23" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

  <!-- Exam Lines -->
  <rect x="20" y="21" width="14" height="3.5" rx="1.75" fill="#2563eb"/>
  <rect x="20" y="28" width="24" height="2.5" rx="1.25" fill="#94a3b8"/>
  <rect x="20" y="34" width="24" height="2.5" rx="1.25" fill="#94a3b8"/>
  <rect x="20" y="40" width="16" height="2.5" rx="1.25" fill="#94a3b8"/>

  <!-- AI Generator Sparkle Badge -->
  <circle cx="44" cy="44" r="10.5" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <path d="M44 38 L45.4 42.6 L50 44 L45.4 45.4 L44 50 L42.6 45.4 L38 44 L42.6 42.6 Z" fill="#ffffff"/>
</svg>
